name: Deploy Backend to Azure App Service

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AZURE_WEBAPP_NAME: warehouse-backend-aspr-src
  NODE_VERSION: '22'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Prepare deployment package
        run: |
          rm -rf deploy
          mkdir deploy
          cp package.json pnpm-lock.yaml deploy/
          [ -f pnpm-workspace.yaml ] && cp pnpm-workspace.yaml deploy/ || true
          cp -r dist deploy/

      - name: Install production dependencies (hoisted, no symlinks)
        working-directory: deploy
        run: |
          echo "node-linker=hoisted" > .npmrc
          pnpm install --prod --frozen-lockfile
          rm -f pnpm-lock.yaml pnpm-workspace.yaml .npmrc

      - name: Verify no broken symlinks
        working-directory: deploy
        run: |
          echo "Symlinks in node_modules: $(find node_modules -maxdepth 1 -type l | wc -l)"
          test -d node_modules/joi && echo "joi OK: real directory"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.WAREHOUSEBACKENDDEVSRC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WAREHOUSEBACKENDDEVSRC_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WAREHOUSEBACKENDDEVSRC_AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./deploy