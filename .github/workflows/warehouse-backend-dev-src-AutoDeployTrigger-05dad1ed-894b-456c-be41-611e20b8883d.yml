name: Trigger auto deployment for warehouse-backend-dev-src

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ develop ]
    paths:
    - '**'
    - '.github/workflows/warehouse-backend-dev-src-AutoDeployTrigger-05dad1ed-894b-456c-be41-611e20b8883d.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.WAREHOUSEBACKENDDEVSRC_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WAREHOUSEBACKENDDEVSRC_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WAREHOUSEBACKENDDEVSRC_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.WAREHOUSEBACKENDDEVSRC_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.WAREHOUSEBACKENDDEVSRC_REGISTRY_PASSWORD }}
          containerAppName: warehouse-backend-dev-src
          resourceGroup: rg-warehouse-learning
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


