workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

test-oidc:
  stage: .pre
  tags:
    - linux
  id_tokens:
    AZURE_ID_TOKEN:
      aud: https://gitlab.anasource.com
  script:
    - echo "Token exists, printing length only:"
    - echo -n "$AZURE_ID_TOKEN" | wc -c