trigger:
  - develop

pool:
  vmImage: ubuntu-latest

variables:
  acrName: 'warehouselearningacr2026'
  imageName: 'warehouse-backend'
  containerAppName: 'warehouse-backend'
  resourceGroup: 'rg-warehouse-learning'

steps:
  - task: AzureCLI@2
    displayName: 'Build and push image to ACR'
    inputs:
      azureSubscription: 'azure-warehouse-connection'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e

        echo "Logging into Azure Container Registry..."
        az acr login --name $(acrName)

        echo "Building Docker image..."
        docker build \
          -t $(acrName).azurecr.io/$(imageName):$(Build.SourceVersion) \
          -f Dockerfile \
          .

        echo "Pushing Docker image..."
        docker push \
          $(acrName).azurecr.io/$(imageName):$(Build.SourceVersion)

        echo "Image pushed successfully."

  - task: AzureCLI@2
    displayName: 'Deploy new revision to Container Apps'
    inputs:
      azureSubscription: 'azure-warehouse-connection'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e

        az containerapp update \
          --name $(containerAppName) \
          --resource-group $(resourceGroup) \
          --image $(acrName).azurecr.io/$(imageName):$(Build.SourceVersion)

  - task: AzureCLI@2
    displayName: 'Verify health endpoint'
    inputs:
      azureSubscription: 'azure-warehouse-connection'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        set -e

        echo "Waiting for Container App revision..."
        sleep 20

        echo "Checking health endpoint..."
        curl -f --max-time 60 \
          https://warehouse-backend.bluerock-4c91c171.centralindia.azurecontainerapps.io/api/health