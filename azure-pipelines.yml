trigger:
  - develop

pool:
  vmImage: ubuntu-latest

steps:
  - task: AzureCLI@2
    displayName: 'Verify Azure login'
    inputs:
      azureSubscription: 'azure-warehouse-connection'
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        az account show
        az group show --name rg-warehouse-learning